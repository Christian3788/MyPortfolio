<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#glow)" stroke-width="3" stroke-dasharray="12 16" opacity="0.6"/>

  <!-- Hexagonal Core Anchor -->
  <polygon points="256,120 376,188 376,324 256,392 136,324 136,188" fill="rgba(99,102,241,0.08)" stroke="url(#accent)" stroke-width="6"/>

  <!-- Monogram Christian Amos (CA) -->
  <g fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- C shape -->
    <path d="M 230 195 C 170 195 160 256 160 256 C 160 256 170 317 230 317"/>
    <!-- A shape -->
    <path d="M 290 317 L 325 195 L 360 317"/>
    <path d="M 302 276 L 348 276"/>
  </g>

  <!-- Pulsing Node Beacons -->
  <circle cx="256" cy="120" r="10" fill="#34d399"/>
  <circle cx="376" cy="188" r="8" fill="#818cf8"/>
  <circle cx="376" cy="324" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="392" r="10" fill="#10b981"/>
  <circle cx="136" cy="324" r="8" fill="#818cf8"/>
  <circle cx="136" cy="188" r="8" fill="#38bdf8"/>
</svg>
